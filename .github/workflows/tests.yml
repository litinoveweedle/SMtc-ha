name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: >-
          python -m pip install
          'homeassistant==2026.11.1' 'pytest-homeassistant==2026.11.1'
      - name: Install integration requirements from PyPI
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          with open("custom_components/smtc/manifest.json") as f:
              requirements = json.load(f)["requirements"]
          subprocess.run(
              [sys.executable, "-m", "pip", "--isolated", "install",
               "--index-url", "https://pypi.org/simple", *requirements],
              check=True,
          )
          PY
      - name: Run integration tests
        run: >-
          python -m pytest -p no:respx --asyncio-mode=auto
          -o asyncio_default_fixture_loop_scope=function -q tests
